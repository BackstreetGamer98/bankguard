name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Scored evals (any unsafe allow fails the run)
        run: python evals/run_evals.py
